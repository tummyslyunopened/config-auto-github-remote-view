{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1116">
  <title>config-auto-github · status</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'status/favicon.svg' %}">
  <link rel="alternate icon" type="image/png" sizes="192x192" href="{% static 'status/icon-192.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'status/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'status/manifest.webmanifest' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="cag-status">
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-border: #30363d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --ok: #3fb950;
      --bad: #f85149;
      --accent: #58a6ff;
      --warn: #d29922;
      --code-bg: #010409;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
              env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      gap: 12px;
      padding: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
      .pane.full { grid-column: 1 / -1; }
    }
    .pane {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .pane h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pane .body { padding: 12px 14px; }
    .pane .body.flush { padding: 0; }

    .dot {
      display: inline-block;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--bad);
      box-shadow: 0 0 0 2px rgba(248,81,73,.15);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 2px rgba(63,185,80,.18); }

    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-all; }

    .empty { color: var(--muted); padding: 8px 0; font-style: italic; }

    .queue-list { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow: auto; }
    .queue-list li {
      padding: 10px 14px;
      border-bottom: 1px solid var(--panel-border);
    }
    .queue-list li:last-child { border-bottom: none; }
    .queue-list .row1 {
      display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .queue-list .title { font-weight: 600; }
    .queue-list .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .queue-list .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(88,166,255,.15);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,.35);
    }

    pre.log {
      margin: 0;
      padding: 12px 14px;
      background: var(--code-bg);
      color: var(--fg);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-height: 50vh;
      overflow: auto;
      white-space: pre;
    }
    pre.log.empty-log { color: var(--muted); font-style: italic; white-space: pre-wrap; }

    .actions {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .actions form { margin: 0; }
    .actions .act {
      font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 8px 12px;
      min-height: 36px;        /* thumb-friendly */
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      color: var(--fg);
      cursor: pointer;
    }
    .actions .act.top    { background: rgba(88,166,255,.10); border-color: rgba(88,166,255,.35); color: var(--accent); }
    .actions .act.pause  { background: rgba(210,153,34,.10); border-color: rgba(210,153,34,.35); color: var(--warn); }
    .actions .act.resume { background: rgba(63,185,80,.10);  border-color: rgba(63,185,80,.35);  color: var(--ok); }
    .actions .act.cancel { background: rgba(248,81,73,.10);  border-color: rgba(248,81,73,.35);  color: var(--bad); }
    .actions .act:active { transform: translateY(1px); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>config-auto-github · status</h1>
    <span class="meta">
      <span data-generated-at>generated {{ s.generated_at }}</span> · refresh {{ s.refresh_seconds }}s ·
      <a href="{% url 'dashboard_json' %}">json</a>
    </span>
  </header>

  <main data-fragment-url="{% url 'dashboard_fragment' %}" data-refresh-seconds="{{ s.refresh_seconds }}">
    {% include 'status/_panes.html' %}
  </main>

  <script>
    (function () {
      var main = document.querySelector('main[data-fragment-url]');
      if (!main) return;
      var fragmentUrl = main.getAttribute('data-fragment-url');
      var refreshMs = (parseInt(main.getAttribute('data-refresh-seconds'), 10) || 5) * 1000;
      var generatedEl = document.querySelector('[data-generated-at]');

      function scrollLogsToBottom(root) {
        (root || main).querySelectorAll('pre.log').forEach(function (el) {
          el.scrollTop = el.scrollHeight;
        });
      }
      scrollLogsToBottom();

      var inFlight = false;
      var pollTimer = null;

      function schedulePoll() {
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = setTimeout(poll, refreshMs);
      }

      async function poll() {
        if (document.hidden) { schedulePoll(); return; }
        if (inFlight) { schedulePoll(); return; }
        inFlight = true;
        try {
          var resp = await fetch(fragmentUrl, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            credentials: 'same-origin',
          });
          if (resp.ok) {
            var html = await resp.text();
            // Remember each log pane's scroll state so manual scrolling sticks
            // across refreshes; if the user is at the bottom we keep tailing.
            var prevScroll = {};
            main.querySelectorAll('section.pane[data-slug]').forEach(function (pane) {
              var slug = pane.getAttribute('data-slug');
              var pre = pane.querySelector('pre.log');
              if (!pre) return;
              var atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 4;
              prevScroll[slug] = { top: pre.scrollTop, atBottom: atBottom };
            });
            main.innerHTML = html;
            main.querySelectorAll('section.pane[data-slug]').forEach(function (pane) {
              var slug = pane.getAttribute('data-slug');
              var pre = pane.querySelector('pre.log');
              if (!pre) return;
              var prev = prevScroll[slug];
              if (!prev || prev.atBottom) {
                pre.scrollTop = pre.scrollHeight;
              } else {
                pre.scrollTop = prev.top;
              }
            });
            if (generatedEl) {
              generatedEl.textContent = 'generated ' + new Date().toISOString().replace(/\.\d+Z$/, '+00:00');
            }
          }
        } catch (e) { /* swallow — try again next tick */ }
        inFlight = false;
        schedulePoll();
      }
      schedulePoll();

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          if (pollTimer) clearTimeout(pollTimer);
          poll();
        }
      });
    })();
  </script>
</body>
</html>
